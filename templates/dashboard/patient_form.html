<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Patient | Piki Ora</title>
</head>
<body>
    <h1>Edit Patient</h1>

    <form method="POST">
        {% csrf_token %}

        <label>First Name</label>
        <input name="first_name" value="{{ patient.user.first_name }}" required>

        <br><br>

        <label>Last Name</label>
        <input name="last_name" value="{{ patient.user.last_name }}" required>

        <br><br>

        <label>Email</label>
        <input type="email" name="email" value="{{ patient.user.email }}" required>

        <br><br>

        <label>Phone</label>
        <input name="phone" value="{{ patient.phone }}" required>

        <br><br>

        <label>Date of Birth</label>
        <input type="date" name="date_of_birth"
               value="{{ patient.date_of_birth|date:'Y-m-d' }}" required>

        <br><br>

        <label>Address</label>
        <textarea name="address" required>{{ patient.address }}</textarea>

        <br><br>

        <button type="submit">Save Changes</button>
        <a href="{% url 'admin_patients' %}">Cancel</a>
    </form>
</body>
</html>
