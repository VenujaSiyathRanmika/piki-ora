<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Delete Appointment Slot | Piki Ora</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #1f2937;
        }

        .header {
            background: #1d4ed8;
            color: white;
            padding: 20px 35px;
        }

        .header h1 {
            margin: 0;
        }

        .container {
            max-width: 600px;
            margin: 70px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 10px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.06);
            text-align: center;
        }

        h2 {
            margin-top: 0;
            color: #991b1b;
        }

        .slot-details {
            font-size: 18px;
            font-weight: bold;
            line-height: 1.7;
            margin: 20px 0;
        }

        .warning {
            color: #6b7280;
            line-height: 1.6;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 25px;
        }

        button,
        a {
            padding: 11px 18px;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            text-decoration: none;
            cursor: pointer;
        }

        button {
            border: none;
            background: #dc2626;
            color: white;
        }

        button:hover {
            background: #b91c1c;
        }

        .cancel {
            background: #e5e7eb;
            color: #374151;
        }

        .cancel:hover {
            background: #d1d5db;
        }
    </style>
</head>

<body>

<header class="header">

    <h1>Piki Ora Medical Centre</h1>

</header>


<main class="container">

    <div class="card">

        <h2>Delete Appointment Slot</h2>

        <p>
            Are you sure you want to delete this appointment slot?
        </p>


        <div class="slot-details">

            <div>
                Dr. {{ slot.doctor.first_name }}
                {{ slot.doctor.last_name }}
            </div>

            <div>
                {{ slot.date }}
            </div>

            <div>
                {{ slot.start_time }} - {{ slot.end_time }}
            </div>

        </div>


        <p class="warning">

            This action cannot be undone.

        </p>


        <form method="POST">

            {% csrf_token %}

            <div class="buttons">

                <button type="submit">
                    Yes, Delete Slot
                </button>

                <a
                    href="{% url 'admin_slots' %}"
                    class="cancel"
                >
                    Cancel
                </a>

            </div>

        </form>

    </div>

</main>

</body>
</html>
