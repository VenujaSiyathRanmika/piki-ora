<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Appointment - Piki Ora</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
        }

        .container {
            max-width: 700px;
            margin: 50px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        h1 {
            color: #1769aa;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        select,
        textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #1769aa;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
        }

        .error {
            background: #fee2e2;
            color: #b91c1c;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 10px;
        }

        .back {
            display: block;
            margin-top: 20px;
            color: #1769aa;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card">

        <h1>Edit Appointment</h1>

        <form method="POST">

            {% csrf_token %}

            {{ form.non_field_errors }}

            <label>
                {{ form.slot.label }}
            </label>

            {{ form.slot }}

            {% for error in form.slot.errors %}
                <div class="error">{{ error }}</div>
            {% endfor %}

            <label>
                {{ form.reason.label }}
            </label>

            {{ form.reason }}

            {% for error in form.reason.errors %}
                <div class="error">{{ error }}</div>
            {% endfor %}

            <button type="submit">
                Save Changes
            </button>

        </form>

        <a class="back" href="{% url 'my_appointments' %}">
            ← Back to My Appointments
        </a>

    </div>

</div>

</body>
</html>
